# System mise settings of the coder devbox (/etc/mise/config.toml).
# Egress allows GitHub, PyPI and npm only: no mise.run, mise-versions.jdx.dev or nodejs.org.
[settings]
# Each pass clones its repositories under /home/coder/sandboxes: trust their mise.toml.
trusted_config_paths = ["/home/coder"]
# Resolve "latest" through GitHub instead of mise-versions.jdx.dev.
use_versions_host = false
# The image ships Node 24 and npm; nodejs.org downloads are refused by the egress proxy.
disable_tools = ["node"]
# Never prompt: the coder runs without a terminal.
yes = true
